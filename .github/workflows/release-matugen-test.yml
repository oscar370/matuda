name: Release-Matugen-Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Matugen
        run: scripts/setup-matugen.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-builds
          path: |
            dist/matugen
